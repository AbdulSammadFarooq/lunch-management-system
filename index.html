<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta id="themeColor" name="theme-color" content="#e7eef0">
  <title>Lunch book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (error) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Shared lunch book</p>
        <h1>Lunch book</h1>
        <p class="lede">Who is ahead, who owes, and what is left in the pot.</p>
      </div>
      <div class="header-actions">
        <a id="manageLink" class="button" href="manage.html" hidden>Update the book</a>
        <button id="themeToggle" class="button ghost" type="button">Dark</button>
      </div>
    </header>

    <main>
      <p id="loading" class="loading">Loading the book…</p>
      <section id="wallets"></section>
      <section id="month"></section>
      <section id="latest"></section>
      <section id="activity" hidden></section>
      <section id="months"></section>
      <footer class="foot">This page only reads the book. The person who keeps it updates <code>data.json</code>, then pushes so everyone else can see the change.</footer>
    </main>
  </div>

  <div id="personModal" class="modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="personTitle">
      <button id="closePerson" class="icon-button" type="button" aria-label="Close">×</button>
      <p class="eyebrow">Wallet</p>
      <h2 id="personTitle">Person</h2>
      <p id="personMath" class="lede"></p>
      <div id="personSummary" class="summary-row"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Entry</th>
              <th>Paid</th>
              <th>Share</th>
              <th>Change</th>
            </tr>
          </thead>
          <tbody id="personRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="ledger.js"></script>
  <script src="app.js"></script>
</body>
</html>
